<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: beige;
            border: 1px solid black;
        }

        table {
            width: 600px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA DE TABELAS GRANDE
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR TD, TH
    -->
        <table>
            <caption>POPULAÇÃO</caption>
            <thead>
                <tr>
                    <th style="width: 50px;">Posição</th>
                    <th scope="col">Estado</th>
                    <th scope="col">Populaçao</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>São Paulo</td>
                    <td>450000</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Minas Gerais</td>
                    <td>25000</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th scope="row" colspan="2">Total de Habitantes</th>
                    <td>000</td>
                </tr>
            </tfoot>
        </table>
</body>
</html>
